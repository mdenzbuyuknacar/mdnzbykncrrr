<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özgürleşen Dalgalar - İnteraktif Sanat</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: crosshair;
        }

        #input_video, #person_canvas {
            display: none;
        }

        #gl_canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #loading {
            position: absolute;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 24px;
            letter-spacing: 2px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loading">Dalgalar Özgürleşiyor...</div>

    <video id="input_video" autoplay playsinline></video>
    <canvas id="person_canvas"></canvas>
    <canvas id="gl_canvas"></canvas>

    <script>
        const videoElement = document.getElementById('input_video');
        const personCanvas = document.getElementById('person_canvas');
        const personCtx = personCanvas.getContext('2d');
        const glCanvas = document.getElementById('gl_canvas');
        const loadingText = document.getElementById('loading');

        let hasVideo = false;

        const MAX_RIPPLES = 40;
        const centers = new Float32Array(MAX_RIPPLES * 2);
        const dropTimes = new Float32Array(MAX_RIPPLES);
        let rippleIndex = 0;

        function spawnRipple(x, y) {
            centers[rippleIndex * 2] = x;
            centers[rippleIndex * 2 + 1] = y;
            dropTimes[rippleIndex] = performance.now() * 0.001;
            rippleIndex = (rippleIndex + 1) % MAX_RIPPLES;
        }

        // Yağmur damlaları
        setInterval(() => {
            let randomX = Math.random();
            let randomY = Math.random();
            spawnRipple(randomX, randomY);
        }, 80);

        // Fare etkileşimi
        let lastMouseTime = 0;
        window.addEventListener('mousemove', (e) => {
            let now = performance.now();
            if (now - lastMouseTime > 30) {
                let x = 1.0 - (e.clientX / window.innerWidth);
                let y = e.clientY / window.innerHeight;
                spawnRipple(x, y);
                lastMouseTime = now;
            }
        });

        window.addEventListener('click', (e) => {
            let x = 1.0 - (e.clientX / window.innerWidth);
            let y = e.clientY / window.innerHeight;
            spawnRipple(x, y);
        });

        function onResults(results) {
            loadingText.style.display = 'none';

            const w = results.image.width;
            const h = results.image.height;

            if (personCanvas.width !== w) {
                personCanvas.width = w; personCanvas.height = h;
                glCanvas.width = w; glCanvas.height = h;
                gl.viewport(0, 0, w, h);
            }

            personCtx.save();
            personCtx.clearRect(0, 0, w, h);
            personCtx.drawImage(results.segmentationMask, 0, 0, w, h);
            personCtx.globalCompositeOperation = 'source-in';
            personCtx.drawImage(results.image, 0, 0, w, h);
            personCtx.globalCompositeOperation = 'destination-over';
            personCtx.fillStyle = '#000000';
            personCtx.fillRect(0, 0, w, h);
            personCtx.restore();

            hasVideo = true;
        }

        // ---- WEBGL (IŞIKLI DALGA FİZİĞİ) ----
        const gl = glCanvas.getContext('webgl');

        const vertexShaderSource = `
            attribute vec2 aPosition;
            attribute vec2 aTexCoord;
            varying vec2 vTexCoord;
            void main() {
                gl_Position = vec4(aPosition, 0.0, 1.0);
                vTexCoord = vec2(aTexCoord.x, 1.0 - aTexCoord.y);
            }
        `;

        const fragmentShaderSource = `
            precision highp float;
            varying vec2 vTexCoord;
            uniform sampler2D uSampler;
            
            uniform float uTime;
            uniform vec2 uCenters[40];
            uniform float uDropTimes[40];

            void main() {
                vec2 uv = vTexCoord;
                vec2 offset = vec2(0.0);
                
                // ÖZGÜRLEŞME MATEMATİĞİ: Işık değişkeni (Karanlıkta parlayacak olan kısımlar)
                float totalLight = 0.0; 
                
                for (int i = 0; i < 40; i++) {
                    float dropTime = uDropTimes[i];
                    
                    if (dropTime > 0.0) {
                        float t = uTime - dropTime;
                        
                        if (t > 0.0 && t < 5.0) {
                            vec2 p = uv - uCenters[i];
                            p.x *= 16.0 / 9.0;
                            
                            float dist = length(p);
                            float waveRadius = t * 0.5;
                            float distToRing = dist - waveRadius;
                            
                            float envelope = exp(-pow(distToRing * 10.0, 2.0)); 
                            
                            // Dalgayı oluşturan sinüs çizgisi
                            float wave = sin(distToRing * 180.0); 
                            
                            // Bedenini büken fiziksel güç
                            float amplitude = 0.055 * exp(-t * 1.2);
                            
                            vec2 dir = normalize(uv - uCenters[i]);
                            offset += dir * wave * envelope * amplitude;
                            
                            // YENİ: IŞIK PARLAMASI (Specular Highlight)
                            // Dalganın tepesine vuran ışığı hesaplıyoruz (Kosinüs kullanarak)
                            float wavePeak = pow(max(0.0, cos(distToRing * 180.0)), 4.0);
                            
                            // Işık, dalga uzaklaştıkça yavaşça söner
                            totalLight += wavePeak * envelope * exp(-t * 1.5) * 0.35;
                        }
                    }
                }
                
                vec2 finalUV = uv + offset;
                finalUV.x = clamp(finalUV.x, 0.0, 1.0);
                finalUV.y = clamp(finalUV.y, 0.0, 1.0);
                
                // Kameradan (ve siyah fona çıkarılmış bedeninden) gelen ana görüntü
                vec4 baseColor = texture2D(uSampler, finalUV);
                
                // Gümüş/Buz mavisi bir ay ışığı rengi
                vec3 moonlightColor = vec3(0.6, 0.8, 1.0) * totalLight;
                
                // Bedeni ve yansımayı al, üzerine de karanlığı aydınlatan dalga ışıklarını ekle!
                gl_FragColor = vec4(baseColor.rgb + moonlightColor, 1.0);
            }
        `;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        gl.useProgram(program);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        const positionLocation = gl.getAttribLocation(program, "aPosition");
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        const texCoordBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 1,1]), gl.STATIC_DRAW);
        const texCoordLocation = gl.getAttribLocation(program, "aTexCoord");
        gl.enableVertexAttribArray(texCoordLocation);
        gl.vertexAttribPointer(texCoordLocation, 2, gl.FLOAT, false, 0, 0);

        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

        const uTimeLocation = gl.getUniformLocation(program, "uTime");
        const uCentersLocation = gl.getUniformLocation(program, "uCenters");
        const uDropTimesLocation = gl.getUniformLocation(program, "uDropTimes");

        function render(time) {
            if (hasVideo) {
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, personCanvas);
                
                gl.uniform1f(uTimeLocation, time * 0.001);
                gl.uniform2fv(uCentersLocation, centers);
                gl.uniform1fv(uDropTimesLocation, dropTimes);
                
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            }
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);

        const selfieSegmentation = new SelfieSegmentation({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
        }});
        selfieSegmentation.setOptions({ modelSelection: 1 });
        selfieSegmentation.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await selfieSegmentation.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        camera.start();

    </script>
</body>
</html>
